name: prismText
on:
  push:
    paths: ['prismText/**', '.github/workflows/prismtext.yml']
  pull_request:
    paths: ['prismText/**', '.github/workflows/prismtext.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prismText
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node engine/cli.mjs selftest
